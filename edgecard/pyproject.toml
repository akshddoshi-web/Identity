[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgecard"
version = "0.1.0"
description = "Daily NBA + NFL betting decision engine (paper mode by default)"
requires-python = ">=3.10"

[project.scripts]
edgecard = "edgecard.cli:main"

[tool.setuptools.packages.find]
include = ["edgecard*", "data_pipeline*", "models*", "edge*", "bankroll*", "guardrails*", "arbitrage*", "sim*", "news*"]
