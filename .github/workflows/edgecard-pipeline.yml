# Edge Card daily pipeline. Free: public-repo Actions minutes, free data
# sources, results committed to the `edgecard-data` branch (never main).
#
#   ~10:00 ET  full run: settle yesterday, snapshot odds, build the card
#   ~17:00 ET  recheck: news/injuries/lines again, update the card
#   evenings   pre-game line captures (closing lines for CLV)
#   Mondays    re-ingest history + re-run the backtest
#
# Cron is UTC, so each slot is listed at its EDT and EST hour; ops/decide_task.py
# keeps the one that lands at the right New York time.
name: edgecard-pipeline

on:
  schedule:
    - cron: "50 13,14 * * *"          # 09:50 ET (either DST state) -> full
    - cron: "50 20,21 * * *"          # 16:50 ET -> recheck
    - cron: "35 16,17,19,20,22,23,0,1,2 * * *"   # pre-game line captures
    - cron: "10 11 * * 2"             # Tuesdays 06-07 ET: ingest + backtest
  workflow_dispatch:
    inputs:
      task:
        description: "auto | full | recheck | close | ingest | backtest"
        default: "auto"
      league:
        description: "nfl | nba | both"
        default: "both"
  push:
    branches: ["claude/beautiful-heisenberg-ds5kfh"]
    paths: ["edgecard/ops/dev-run.txt"]

concurrency:
  group: edgecard-data
  cancel-in-progress: false

permissions:
  contents: write

env:
  EDGECARD_DATA_DIR: /home/runner/store
  PYTHONUNBUFFERED: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: edgecard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: edgecard/requirements.txt

      - name: Install
        run: pip install -r requirements.txt && pip install -e .

      - name: Check out the data branch
        run: |
          cd ..
          if git ls-remote --exit-code --heads origin edgecard-data >/dev/null; then
            git fetch --depth 1 origin edgecard-data:edgecard-data
            git worktree add "$EDGECARD_DATA_DIR" edgecard-data
          else
            git worktree add --orphan -b edgecard-data "$EDGECARD_DATA_DIR"
            printf '{"git":{"deploymentEnabled":false}}\n' > "$EDGECARD_DATA_DIR/vercel.json"
            printf '# edgecard-data\nMachine-written results for Edge Card. Do not edit by hand.\n' > "$EDGECARD_DATA_DIR/README.md"
          fi

      - name: Decide task
        id: task
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then REQ=$(head -1 ops/dev-run.txt); else REQ="${{ github.event.inputs.task || 'auto' }}"; fi
          if [ "${{ github.event.schedule }}" = "10 11 * * 2" ]; then REQ=ingest_backtest; fi
          TASK=$(python ops/decide_task.py "$REQ")
          LEAGUE="${{ github.event.inputs.league || 'both' }}"
          if [ "${{ github.event_name }}" = "push" ]; then LEAGUE=$(sed -n 2p ops/dev-run.txt); LEAGUE=${LEAGUE:-both}; fi
          echo "task=$TASK" >> "$GITHUB_OUTPUT"; echo "league=$LEAGUE" >> "$GITHUB_OUTPUT"
          echo "Task: $TASK  League: $LEAGUE"

      - name: Ingest history
        if: steps.task.outputs.task != 'skip'
        run: |
          if [[ "${{ steps.task.outputs.task }}" == *ingest* ]] || [ ! -f "$EDGECARD_DATA_DIR/history/nfl_games.parquet" ]; then
            edgecard ingest --league ${{ steps.task.outputs.league }}
          else
            echo "history present; weekly ingest refreshes it"
          fi
        continue-on-error: true

      - name: Backtest
        if: contains(steps.task.outputs.task, 'backtest')
        run: edgecard backtest --league ${{ steps.task.outputs.league }}

      - name: Settle finished games
        if: steps.task.outputs.task == 'full'
        run: edgecard settle --league ${{ steps.task.outputs.league }} && edgecard report
        continue-on-error: true

      - name: Snapshot odds + props (all free books)
        if: steps.task.outputs.task == 'full' || steps.task.outputs.task == 'recheck' || steps.task.outputs.task == 'close'
        run: edgecard snapshot --league ${{ steps.task.outputs.league }} --tag ${{ steps.task.outputs.task == 'close' && 'close' || 'live' }}

      - name: Build the card
        if: steps.task.outputs.task == 'full' || steps.task.outputs.task == 'recheck'
        run: edgecard today --league ${{ steps.task.outputs.league }} --mode ${{ steps.task.outputs.task }}

      - name: Commit results to edgecard-data
        if: always() && steps.task.outputs.task != 'skip'
        run: |
          cd "$EDGECARD_DATA_DIR"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git -c user.name="edgecard-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "edgecard: ${{ steps.task.outputs.task }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git push origin edgecard-data && exit 0
            git pull --rebase origin edgecard-data || true
            sleep $((2**i))
          done
          exit 1
