name: edgecard-tests

on:
  push:
    paths: ["edgecard/**", ".github/workflows/edgecard-*.yml"]
  pull_request:
    paths: ["edgecard/**", ".github/workflows/edgecard-*.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: edgecard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: edgecard/requirements.txt
      - run: pip install -r requirements.txt && pip install -e .
      - run: python -m pytest -q
